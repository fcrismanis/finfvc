# /etc/nginx/sites-available/mcp.crismanis.com.br  (depois: ln -s em sites-enabled)
server {
    listen 80;
    server_name mcp.crismanis.com.br;

    location /mcp {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;          # MCP usa streaming
        proxy_read_timeout 3600s;
        access_log off;               # o token vai no caminho da URL: não registrar
    }
    location /health { proxy_pass http://127.0.0.1:3010; }
}
# Depois: sudo certbot --nginx -d mcp.crismanis.com.br   (adiciona o HTTPS)
